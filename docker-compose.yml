services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
    networks:
      - learning-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-db:
    image: mysql:8.0
    container_name: learning-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: learning_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - learning-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Stack (Redis + RedisInsight в одном контейнере)
  redis-stack:
    image: redis/redis-stack:latest
    container_name: learning-redis-stack
    ports:
      - "6379:6379"   # Redis порт
      - "8001:8001"   # RedisInsight порт (встроенный)
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - learning-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: learning-frontend
    ports:
      - "3000:80"
    networks:
      - learning-network
    restart: on-failure
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=/api

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - learning-network
    restart: on-failure
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - MYSQL_URL=${MYSQL_URL:-jdbc:mysql://mysql-db:3306/learning_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1zZWNyZXQta2V5LWZvci1oczM4NC1hbGdvcml0aG0tdGhhdC1pcy1sb25nLWVub3VnaC0xMjM=}
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - learning-network
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  exam-service:
    build: ./exam-service
    container_name: exam-service
    ports:
      - "8082:8082"
    environment:
      - MYSQL_URL=${MYSQL_URL:-jdbc:mysql://mysql-db:3306/learning_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1zZWNyZXQta2V5LWZvci1oczM4NC1hbGdvcml0aG0tdGhhdC1pcy1sb25nLWVub3VnaC0xMjM=}
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - learning-network
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:

networks:
  learning-network:
    driver: bridge