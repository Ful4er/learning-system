server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/learning_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: mypassword1234
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: password
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      client-name: user-service
      database: 0
  cache:
    redis:
      time-to-live: 60000
      cache-null-values: false
    custom:
      ttl:
        user: 90000
        user-current: 60000
        jwt-validation: 300000
        jwt-blacklist: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
jwt:
  expiration: 86400000
  # Security: provide JWT secret via environment variable `JWT_SECRET` (recommended) or a secrets manager.
  # Do NOT commit production secrets to source control.
  secret: ${JWT_SECRET:}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG