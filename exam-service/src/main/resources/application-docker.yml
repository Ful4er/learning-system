server:
  port: 8082

spring:
  application:
    name: exam-service
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_exam
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:learning-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}
      username: ${REDIS_USERNAME:}
      client-name: exam-service
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      database: 0
  cache:
    redis:
      time-to-live: 60000
      cache-null-values: false
    custom:
      ttl:
        exam: 600
        exam-list: 300
        questions: 1800
        user: 900
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
jwt:
  expiration: 86400000
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1zZWNyZXQta2V5LWZvci1oczM4NC1hbGdvcml0aG0tdGhhdC1pcy1sb25nLWVub3VnaC0xMjM=}

api:
  user-service:
    url: ${API_USER_SERVICE_URL:http://user-service:8081}